# Founder decision (2026-08-25): the creator pack's front-door router is priced with the
# pack it opens, not with its own (zero-spend, CORE) mechanics.
#
# HONEST NOTE ON ENFORCEMENT — this floor binds NOTHING today, and was chosen with that
# known. `video-router` is deliberately not a node in any graph (it runs BEFORE a pack,
# to pick which variant to start), and gtm_core/packs/reachability.py builds the
# entitled-skill allowlist from graph NODES only — so on backend pack-mode runs it is
# already unreachable at any price, while the cockpit/VPS path pins PRO_PLUS. The real
# paywall lands one step later: every creator/* graph resolves pro_plus. This entry is
# therefore forward-looking consistency (it binds the day the router becomes a node, or
# the day an unscoped path stops pinning PRO_PLUS), not a live control. Do not cite it
# as evidence that the creator front door is gated — cite the graph floors.
#
# Accepted cost: a free workspace asking "make me a video" on a surface that DOES consult
# this floor gets a bare denial, rather than being told which lane it would need and
# which identity handles are missing.

[skills.video-router]
min_entitlement = "pro_plus"
reason = "creator front door priced with the pack it opens, founder decision 2026-08-25 — see the block comment above; inert today (not a graph node), forward-looking consistency."

# ── graph overrides ────────────────────────────────────────────────────────────────
# Overrides the derived commercial floor for a pack/variant glob (fnmatch'd against
# "<pack>/<variant>"). Raising above the derived floor is always a legal pricing
# decision; an override below the floor is rejected at resolve time (fail-closed).
#
# None today: every pack's price is carried by its own node skills. Add one only when a
# graph should cost MORE than the sum of its parts.

# ── carve policy ───────────────────────────────────────────────────────────────────
# The OSS-distribution counterpart to the commercial floors above. `[skills.*].oss`
# decides whether a skill's BODY ships; this decides which pack GRAPHS may ship while
# carrying a stubbed node.
#
# Why it needs its own declaration: the cross-axis invariant that keeps a paying user
# away from a stub is commercial (`test_no_private_skill_sits_in_a_free_graph` — every
# private skill floors at "pro", so no free graph can contain one). That invariant does
# nothing for a SELF-HOSTER, who has no entitlement at all: the unscoped cockpit/VPS
# path runs `allowed_skills=None`, so every shipped graph is reachable at any price.
# Shipping such a graph is legitimate — the generated stub SKILL.md names the skill as
# hosted-only and refuses to improvise — but it must be a decision someone made, not a
# by-product of a later `oss = "private"` edit silently breaking another graph.
#
# `python -m gtm_core.gating graph-check <root>` fails closed on an UNDECLARED
# stub-bearing graph and on a STALE entry here that no longer carries one; it runs over
# the finished carve in scripts/oss-export.sh §6 and over the live tree in
# tests/contracts/test_gating_policy.py.
#
# The five below are the creator pack's render lanes. They ship deliberately: the graph
# shape — radar -> plan -> script -> storyboard -> render -> finish -> publish — is the
# part a self-hoster learns from and can rewire to their own renderer, and every one of
# them resolves pro_plus commercially, so nothing here contradicts the paid boundary.
# creator/cross-modal-campaign is absent on purpose: it runs end to end on public skills.

[carve]
stub_bearing_graphs = [
  "creator/demo-clips",
  "creator/live-action-video",
  "creator/presenter-video",
  "creator/repurpose-clips",
  "creator/restyle-shorts",
  "creator/short-form-video",
]
reason = """\
creator render lanes ship their graph shape with a hosted-only render node — the DAG is \
the reusable part, the renderer is the product. Declared 2026-08-28 when graph-check was \
added; before that the five shipped silently. creator/live-action-video joined 2026-08-29 \
for a DIFFERENT reason worth stating rather than folding into the sentence above: it has \
NO render node at all — nothing on that lane is synthesised, which is its defining \
property — and it is stub-bearing only because its capture node runs video-clip, the \
hosted Reap clipping surface. Same conclusion, different cause: the write-then-shoot DAG \
is the reusable part and the clipping service is the product.\
"""
