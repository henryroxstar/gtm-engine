# Commercial (min_entitlement) and distribution (oss) policy for gtm-engine.
#
# This is the ONLY place tier-pricing and open-source-distribution decisions are made.
# capability_tier — the TECHNICAL fact of what a skill needs to run (connectors, paid
# compute) — lives on the skill's own manifest in gtm_core/skills/<name>.py and is never
# duplicated here.
#
# Changing what is paid, or what ships in the public gtm-engine carve, is a one-line
# edit to this file plus a `reason` — no Python touched, no graph TOML touched.
# tests/contracts/test_gating_policy.py enforces:
#   - every real pack graph's effective min_entitlement clears the max commercial floor
#     of its own nodes (a skill's floor may be RAISED by an override, never lowered)
#   - every [skills.*] / [graphs.*] override here names a skill or pack/variant that
#     actually exists, and carries a `reason`
#   - no `oss = "private"` skill sits in a graph whose effective min_entitlement is "free"
#     (a free user would otherwise reach a stub and get a broken run)
#   - every graph that ships a stubbed node is DECLARED in [carve].stub_bearing_graphs,
#     and every declaration still names one (see the [carve] block at the bottom — the
#     self-hoster case the commercial invariant above cannot cover)

[defaults]
# Commercial floor for a skill's technical tier, when the skill has no per-skill
# override below. Keys are gtm_core.tiers.Tier values; values are gtm_core.capabilities
# .Entitlement values.
core = "free"
pipeline = "pro"
production = "pro_plus"

# A skill whose TECHNICAL tier (capability_tier, on its own manifest — never its
# commercial price) is in this list ships PRIVATE (stubbed) in the OSS carve by
# default, unless a [skills.<name>] override explicitly sets oss = "public" or
# "private". This is deliberately keyed off the technical tier and NOT the derived
# commercial floor above: a CORE/PIPELINE skill sold at "pro_plus" (e.g. every
# marketing-pack skill since 2026-08-25) must still default PUBLIC — what a workspace
# pays is a pricing decision, not a reason to withhold the code from a self-hoster.
oss_private_tiers = ["production"]

# ── skill overrides ────────────────────────────────────────────────────────────────
# Overrides the derived commercial floor and/or OSS visibility for one named skill.
# capability_tier is untouched — see the skill's own manifest in gtm_core/skills/.

[skills.airq-scan]
min_entitlement = "free"
oss = "public"
reason = """\
give-first outreach asset. Technically PRODUCTION (requires_capability=gateway, makes \
paid render calls) but sold free by founder decision (2026-08-17): the free tier's \
$0.00 monthly budget cap is the real spend control, and the skill's own documented \
degraded mode (spec + text wireframe, no paid call) is exactly the free-tier \
experience. This is the reference case for why commercial tier and technical tier are \
separate axes — see PRD §2.2.\
"""

