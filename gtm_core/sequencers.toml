reply-received, email-bounced, prospect-unsubscribed, prospect-finished, prospect-outcome-updated,
sequence-paused, email-account-disconnected, plus the task-* family. Custom headers (≤5), retries,
delivery logs, replay, 50 active webhooks per account. A created webhook starts `paused` and carries
a testDelivery result.
SC7 APPROVED 2026-09-21 — receiver scoped to the existing backend + Cloudflare Tunnel, with polling
RETAINED as fallback. `email-account-disconnected` was the deciding event: a deliverability incident
this system has no other detection path for."""

