[providers.saleshandy.capabilities.reply_text_unsubscribe]
supported = "unknown"
source = "https://docs.saleshandy.com/en/articles/7055488-sequence-settings-what-why-and-how-to-set-it-up"
verified_on = "2026-09-21"
ui_path = "Sequence → Settings → Unsubscribe → Unsubscribe as Text"
notes = """UNRESOLVED CONTRADICTION — SC3 settles it, and it must be settled by a live send.
Vendor docs (read 2026-09-21) say "Unsubscribe as Text" is ON by default and lets leads "reply with
a simple text (e.g. 'Stop' or 'Remove') to opt out".
This repo holds a dated first-party observation to the contrary (2026-08-11, gtm_core/optout_watch.py):
a reply of "Unsubscribe" left `Unsubscribed: No`. Most likely the text match keys on the specific
configured phrase.
`unknown` — which REFUSES — is the correct state: vendor prose does not overturn a dated live
observation, and assuming the provider suppresses reply-based opt-outs when it may not is the one
error here with a legal deadline attached. Our own matcher carries the load until SC3 resolves it.
WHY THIS IS URGENT, NOT ACADEMIC — live read 2026-09-22 (setting code 2, all seven sequences; no
row re-dated, because nothing here settles `supported`). Code 2 is the opt-out instruction printed
to every recipient, and BOTH live variants tell them to opt out by REPLYING one word:
"If this isn'''t relevant, just reply '''stop''' and I won'''t follow up." (2 sequences) and
"Reply '''Stop''' if you'''d prefer not to receive messages at this time." (5 sequences).
So the path this row calls "unknown" is the ONLY path our own copy offers anyone. If the provider
does not honour it, every one of those opt-outs rests entirely on our matcher — which is exactly
where the 2026-08-11 observation says the provider left `Unsubscribed: No`.
That reading also found a defect in the matcher and fixed it the same day: the bare-stop branch
only fires when "stop" is essentially the whole message, and a phone signature or a quoted original
pushes the body past the cap, so six of eight realistic shapes of the very reply we ask for were
read as ordinary prose. See `optout_watch._reply_head`.

NARROWED 2026-09-22 BY READING THE PRODUCT UI (read-only; `supported` and `verified_on`
deliberately UNCHANGED, because this does not settle the question and only a live send can).
The v3 Unsubscribe panel presents Text and Link as MUTUALLY EXCLUSIVE radios under "Choose Your
\"Unsubscribe\" Format:", which the API payload corroborates — code 1 (link) is empty and code 2
(text) holds the message, i.e. the text format is the selected one. So the feature is ON; the
earlier hope that it was simply switched off does not explain the 2026-08-11 observation.
What the UI actually CLAIMS each format does is the interesting part, and the two differ in kind:
  - "Unsubscribe as Text"  -> "Adds a plain-text unsubscribe message in your email footer."
  - "Unsubscribe as Link"  -> "Adds a clickable \"Unsubscribe\" link in your email."
The link description names a mechanism the provider necessarily handles (a click it receives).
The text description describes INSERTION ONLY and claims no reply detection whatsoever. That is
a third independent source, and it agrees with the first-party observation rather than with the
help-centre prose, which is the only place "reply with a simple text ... to opt out" appears.
Weight of evidence is now two-to-one that the provider does NOT watch for a reply and merely
prints the sentence — which would mean every opt-out our copy invites rests entirely on our own
matcher. Still "unknown", still REFUSING, because UI helper text not mentioning a behaviour is
evidence of absence only in the weak sense, and this is the one row with a legal deadline
attached. SC3 (a live reply from a mailbox the operator controls) remains the settling test."""

