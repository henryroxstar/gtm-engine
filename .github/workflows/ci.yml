name: ci

# CI for the GTM Content OS runtime.
# Independent jobs so a single red gate is easy to read in the Checks UI:
#   gates      — the dependency-free integrity gates (de-brand / resolve / skill manifest)
#   tests      — the Python contract + content-linter test suite (pytest)
#   actionlint — lints the workflow YAML in .github/workflows/
#   gitleaks   — secret scan over full history (needs fetch-depth: 0)
#   oss-carve  — the real OSS export with every gate but changelog freshness (private tree)
#
# Trigger shape — PR-driven, exactly-once (2026-08-22). This gate previously ran
# only on main, so NOTHING here (pytest, the de-brand/resolve/manifest gates,
# gitleaks) ever ran on the dev integration branch: two defects — an unpinned
# `mcp` that resolved to a breaking 2.0.0, and a stale generated knowledge-usage
# doc — both landed on dev and were only caught at the dev→main PR, one commit
# late. Coverage now follows the real branch flow (feature → dev → main), which
# `auto-pr-claude-branches.yml` implements with `--base dev`:
#   claude/** → PR into dev   : pull_request run
#   dev       → PR into main  : pull_request run (fires on every push to dev)
#   merge into main           : push run (no PR exists for it)
# `push` is deliberately NOT listed for dev: a push to dev with the long-lived
# dev→main PR open already fires a pull_request(synchronize) run, so listing both
# double-runs every job (the exact duplication this shape removes — six
# static-analysis jobs were running twice per PR). Ref-keyed concurrency cannot
# collapse them: a push is refs/heads/dev while its PR is refs/pull/N/merge.
# Tradeoff, stated rather than hidden: a direct push to dev while NO dev→main PR
# is open is untested until that PR opens. main is never exposed by this — the
# PR that carries those commits still gates them before merge.
#
# PR AUTHORSHIP (2026-08-24, resolved). `claude/** → PR into dev` initially did
# NOT get a `pull_request` run: the PR was opened by `auto-pr-claude-branches.yml`
# with GITHUB_TOKEN, authored by `app/github-actions`, and GitHub parks such a
# PR's `opened` run in `action_required` pending a maintainer click — proven on
# PR #175 (runs 32653580453/32653580460, `action_required`, 0s, zero jobs). Fixed
# by minting an installation token from a repo-scoped GitHub App in
# auto-pr-claude-branches.yml; App-authored PRs are not gated. Verified on
# PR #177: `opened` run completed `success` with real job durations (runs
# 32655744480/32655744505). A `claude/**` push fallback lane
# briefly covered the gap (PR #175 → #176) and was removed once the App path was
# confirmed live — reintroducing it would resurrect the double-run tradeoff the
# 2026-08-22 shape removed. If `auto-pr-claude-branches.yml`'s AUTOPR_APP_ID
# variable or AUTOPR_APP_PRIVATE_KEY secret is ever removed, this hole reopens.
#
# Secrets: this CI needs none. The gate scripts and tests are stdlib-only and
# read source from the checkout; real secrets live in Doppler at runtime only.
# Security: no job interpolates untrusted event input (PR/issue/commit text)
# into a run: block — the only ${{ }} expressions used are pinned-action refs
# and the auto-provided GITHUB_TOKEN.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# Least privilege: read-only token everywhere. No job here writes to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save runner minutes; never
# touch other refs. (Each job is independent, so cancelling mid-run is safe.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Integrity gates ──────────────────────────────────────────────────────
  # The three dependency-free shell gates that guard the de-branded plugin:
  #   - debrand_check.sh   : ZERO hardcoded company tokens in plugin/skills/
  #   - resolve_check.sh   : every skill ref resolves against a sample profile
  #   - skill_manifest.sh  : skills parse; product-bound caps satisfied by profile
  # These run first because they are fast (<1s each) and catch the most common
  # class of regression (company facts leaking into the engine).
  gates:
    name: integrity gates (de-brand / resolve / manifest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: de-brand lint
        run: bash tests/lint/debrand_check.sh

      # RELEASE scope = the OSS export's own pre-flight gate (whole publishable surface +
      # widened token list). Running it here keeps dev exportable at all times — normal mode
      # above only scans plugin/skills/ + gtm_core/skills/, which let tenant tokens in
      # gtm_core/*.py and SHIPPING_DOCS reach export day three times on 2026-08-11/12.
      - name: de-brand lint (RELEASE scope)
        run: bash tests/lint/debrand_check.sh --release

      - name: resolve check
        run: bash tests/lint/resolve_check.sh

      - name: model deprecation lint
        run: bash tests/lint/model_deprecation_check.sh

      # Third-party PII: the de-brand lint proves OUR name is gone, never that someone
      # else's is. A real contact kept as a fixture passes every other gate (v0.8.0).
      # Stdlib-only, so it needs no setup step.
      - name: PII lint (no real contacts in source)
        run: python3 tests/lint/pii_check.py

      # §R10 file-length ratchet: unlisted production files capped at 500 lines, listed files
      # frozen at their ceiling, stale entries and retired patch paths rejected — and, against
      # the PR base, a raised ceiling or a new entry needs its own dated reason. The pre-commit
      # hook runs the same check against HEAD; this step is what survives `--no-verify`. On a
      # pull_request the base is fetched at depth 1 just for the compare; on a push there is no
      # base, so the growth/stale/retired checks run without it. Stdlib-only, no setup step.
      - name: complexity ratchet (§R10) — growth + raise guard vs the PR base
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            python3 tests/lint/complexity_check.py --base "origin/$GITHUB_BASE_REF"
          else
            python3 tests/lint/complexity_check.py
          fi

      - name: skill manifest smoke
        run: bash tests/smoke/skill_manifest.sh

  # ── 2. Python tests ─────────────────────────────────────────────────────────
  # Contract/schema tests + content-linter unit tests. The suite is stdlib-only
  # apart from the test runner itself (pytest); minijsonschema is a vendored,
  # dependency-free validator in tests/contracts/. We install pytest, plus the
  # project itself if a root pyproject.toml exists (it is authored by the
  # cockpit component) so the agent/ and cockpit/ packages import cleanly.
  tests:
    name: pytest (contracts + linter)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # tests/media/ needs a real ffmpeg (operator decision: install here rather than a
      # separate job, so tiers B/C run on every PR). NOTE:
      # Ubuntu's apt ffmpeg is built WITH libfreetype/libass (drawtext/ass/subtitles all present)
      # — the operator's local Homebrew build is NOT. Never let gtm_core/video_finish.py or any
      # fixture use drawtext/ass/subtitles: it would pass here and fail on the machine every real
      # asset is made on. Captions are PIL-rendered PNGs composited with plain `overlay` instead.
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: install test deps
        run: |
          python -m pip install --upgrade pip
          # pytest is the hard test-time dependency; pillow backs gtm_core/captions.py's PIL-only
          # rendering (F1/F2) — without it the caption tests importorskip into silence, which is
          # coverage that looks green and measures nothing (the §8.1 failure this program exists
          # to fix).
          pip install pytest pillow
          # If the project defines a root package (pyproject.toml — authored by the
          # cockpit component), install it so agent/ + cockpit/ imports resolve.
          # Best-effort: deps like claude-agent-sdk may be unavailable in CI, so a
          # failed editable install must NOT fail the test gate.
          if [ -f pyproject.toml ]; then
            pip install -e . || echo "::warning::editable install failed (deps unavailable in CI); running stdlib-only tests"
          fi

      - name: pytest
        run: python -m pytest tests/ -q

  # ── 2b. Backend live-DB tenant-isolation tier ───────────────────────────────
  # The dbtest suite (tests/backend/test_rls_live.py) needs a REAL Postgres to
  # prove FORCE RLS + the non-owner gtm_api role isolate tenants — mocking the
  # pool (as the fast `tests` job does) cannot. The service tracks the major that
  # deploy/docker-compose.yml actually runs (18 as of 2026-08-24) — a gate proving
  # tenant isolation on a different major than production ships is the "green but
  # wrong" shape. Safe to bump here where the compose file is not: a service
  # container has no persistent volume, so it initdb's fresh every run and never
  # meets the PG18 PGDATA relocation trap the deploy runbook exists for.
  # the suite self-skips everywhere else (no GTM_TEST_PG_ADMIN_DSN set), so the
  # `tests` job stays green. This job installs only pytest + asyncpg (the tested
  # code path, backend.database, needs no Agent SDK) and targets the dbtest file
  # directly so it never collects the SDK-dependent mocked suites.
  backend-db:
    name: pytest (live-DB RLS tier)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gtm_app
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gtm_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtm_app -d gtm_backend"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest asyncpg

      - name: pytest (dbtest tier)
        env:
          GTM_TEST_PG_ADMIN_DSN: postgres://gtm_app:postgres@localhost:5432/gtm_backend
        run: python -m pytest tests/backend/test_rls_live.py tests/backend/test_cost_reservation_live.py tests/mcp_server/test_mcp_rls_live.py -q

  # ── 3. actionlint ───────────────────────────────────────────────────────────
  # Static-analyse the workflow YAML itself (shellcheck on run: blocks, expression
  # syntax, action input validation). Runs against this repo's workflows only.
  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (official binary)
        run: |
          # Run the official actionlint binary directly. The raven-actions wrapper
          # action broke on the runner (ERR_PACKAGE_PATH_NOT_EXPORTED in its bundled
          # @actions/tool-cache). The download script fetches the latest binary to
          # ./actionlint; it lints .github/workflows/*.yml (incl. shellcheck on run:).
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # ── 4. gitleaks ─────────────────────────────────────────────────────────────
  # Secret scan over the full commit range — fetch-depth: 0 is REQUIRED so the
  # scan sees the whole history, not just the tip.
  #
  # We run the gitleaks BINARY (Apache-2.0, free), NOT gitleaks/gitleaks-action —
  # that action requires a PAID GITLEAKS_LICENSE for GitHub *organizations* since
  # v2 ("[org] is an organization. License key is required."). The binary has no
  # such gate. `gitleaks detect --exit-code 1` exits non-zero on a finding (fails
  # the job); 0 = clean.
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — gitleaks needs the commit range to scan

      - name: gitleaks (free binary — no org-license gate)
        run: |
          # Pinned version avoids hitting the unauthenticated GitHub API rate limit.
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  # ── 5. OSS carve ────────────────────────────────────────────────────────────
  # Runs the REAL export (scripts/oss-export.sh) on every PR, so "is dev exportable?" is
  # answered at PR time rather than on export day. Every everyday lint measures a NARROWER
  # surface than the carve — that gap is how a tenant token, a withheld design-doc citation,
  # a product name drawn on screen in capitals, and nine carve-only pytest failures each
  # reached a release day (2026-07-13 → 2026-09-03, every export blocked by something new).
  # The export is the one check that measures exactly what ships, so it runs here as-is:
  # pre-flight, carve invariants, then pytest/codegen/resolve/manifest/lint/gitleaks/compose
  # INSIDE the carved tree. The changelog-freshness gate is the one part that only makes
  # sense on export day (CHANGELOG_GATE=0 skips it and nothing else).
  # Self-skips in the public cut, where only bootstrap.sh ships from scripts/.
  oss-carve:
    name: OSS carve (the export's own gates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: private tree?
        id: probe
        run: |
          if [ -f scripts/oss-export.sh ]; then
            echo "private=true" >> "$GITHUB_OUTPUT"
          else
            echo "private=false" >> "$GITHUB_OUTPUT"
            echo "not the private tree (no export script) — nothing to carve"
          fi

      # Pinned to 3.13 like every other job here, and load-bearing for a reason the others
      # do not have: the carve's post-carve gate runs its OWN `uv sync` inside $DEST, and the
      # cut's pyproject says `requires-python = ">=3.11"`. Unpinned, that resolved to
      # ubuntu-24.04's system 3.12 while operators (and the committed CLI-help goldens) are on
      # 3.13 — argparse renders a subcommand `{a,b,c}` choices line differently across that
      # boundary, so `test_every_subcommand_in_the_live_help_has_a_golden` failed in CI on a
      # carve that is green on 3.13. Pin the interpreter, not the goldens.
      - name: set up uv
        if: steps.probe.outputs.private == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      # pdftotext proves the shipped onboarding PDF carries no tenant token (§6 binary-doc
      # sweep); ffmpeg is what tests/media needs inside the carve, exactly as in `tests`.
      - name: install pdftotext + ffmpeg
        if: steps.probe.outputs.private == 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg

      - name: install gitleaks (free binary — same pin as the gitleaks job)
        if: steps.probe.outputs.private == 'true'
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks
          gitleaks version

      - name: export (carve + every gate, changelog freshness excepted)
        if: steps.probe.outputs.private == 'true'
        env:
          CHANGELOG_GATE: "0"
        run: bash scripts/oss-export.sh "$RUNNER_TEMP/gtm-engine-cut"


