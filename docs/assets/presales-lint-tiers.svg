 9.375)"><text x="0" y="13.42529296875" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#0f172a" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Graded, but it does not block.</text></g><g transform="translate(580 268) rotate(0 117 16.25)"><text x="0" y="11.63525390625" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#475569" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Fix it — or say why not, in a</text><text x="0" y="27.88525390625" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#475569" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">lint-ok comment with a reason.</text></g><g stroke-linecap="round" transform="translate(30 374) rotate(0 105 32)"><path d="M16 0 C55.16 0, 94.31 0, 194 0 C204.67 0, 210 5.33, 210 16 C210 26.41, 210 36.82, 210 48 C210 58.67, 204.67 64, 194 64 C134.29 64, 74.59 64, 16 64 C5.33 64, 0 58.67, 0 48 C0 40.22, 0 32.43, 0 16 C0 5.33, 5.33 0, 16 0" stroke="none" stroke-width="0" fill="#fef3c7"></path><path d="M16 0 C51.6 0, 87.2 0, 194 0 M16 0 C64.41 0, 112.83 0, 194 0 M194 0 C204.67 0, 210 5.33, 210 16 M194 0 C204.67 0, 210 5.33, 210 16 M210 16 C210 22.96, 210 29.92, 210 48 M210 16 C210 28.46, 210 40.93, 210 48 M210 48 C210 58.67, 204.67 64, 194 64 M210 48 C210 58.67, 204.67 64, 194 64 M194 64 C155.61 64, 117.22 64, 16 64 M194 64 C155.58 64, 117.17 64, 16 64 M16 64 C5.33 64, 0 58.67, 0 48 M16 64 C5.33 64, 0 58.67, 0 48 M0 48 C0 38.82, 0 29.64, 0 16 M0 48 C0 39.15, 0 30.31, 0 16 M0 16 C0 5.33, 5.33 0, 16 0 M0 16 C0 5.33, 5.33 0, 16 0" stroke="#b45309" stroke-width="2" fill="none"></path></g><g transform="translate(35 396) rotate(0 100 10)"><text x="100" y="14.3203125" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#1e293b" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Judgement call   ~</text></g><g