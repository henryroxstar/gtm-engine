<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="wardley-title wardley-desc">
  <title id="wardley-title">Voice agent stack — what to build vs. buy</title>
  <desc id="wardley-desc">Wardley map plotting Wavelet Interactive's voice agent value chain from caller experience down to infrastructure against genesis-to-commodity evolution, with the agent planner commoditising toward the product band.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <!-- Axis lines (value chain vertical, evolution horizontal) -->
  <line x1="120" y1="60" x2="120" y2="340" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
  <line x1="120" y1="340" x2="920" y2="340" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

  <!-- Evolution band separators -->
  <line x1="320" y1="60" x2="320" y2="340" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="520" y1="60" x2="520" y2="340" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="720" y1="60" x2="720" y2="340" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Band labels -->
  <text x="220" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">GENESIS</text>
  <text x="420" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">CUSTOM-BUILT</text>
  <text x="620" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">PRODUCT</text>
  <text x="820" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">COMMODITY</text>

  <!-- Value-chain axis labels (stacked lines, never writing-mode) -->
  <text x="112" y="44" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">VISIBLE TO</text>
  <text x="112" y="56" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">THE CALLER</text>
  <text x="112" y="352" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">INVISIBLE</text>

  <!-- Dependency links (exempt from the orthogonal-elbow rule — position is the data) -->
  <line x1="420" y1="92" x2="620" y2="124" stroke="#4f5d75" stroke-width="0.8"/>
  <line x1="620" y1="124" x2="420" y2="156" stroke="#4f5d75" stroke-width="0.8"/>
  <line x1="420" y1="156" x2="220" y2="188" stroke="#4f5d75" stroke-width="0.8"/>
  <line x1="420" y1="156" x2="620" y2="220" stroke="#4f5d75" stroke-width="0.8"/>
  <line x1="420" y1="156" x2="680" y2="252" stroke="#4f5d75" stroke-width="0.8"/>
  <line x1="620" y1="220" x2="820" y2="316" stroke="#4f5d75" stroke-width="0.8"/>
  <line x1="680" y1="252" x2="820" y2="284" stroke="#4f5d75" stroke-width="0.8"/>
  <line x1="220" y1="188" x2="820" y2="284" stroke="#4f5d75" stroke-width="0.8"/>

  <!-- Movement arrow (the 2nd accent element) -->
  <line x1="428" y1="156" x2="504" y2="156" stroke="#eb6c36" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

  <!-- Components -->
  <circle cx="420" cy="92" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="420" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Caller experience</text>

  <circle cx="620" cy="124" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="620" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Voice edge / telephony</text>

  <!-- Moving component (the 1st accent element) -->
  <circle cx="420" cy="156" r="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
  <text x="420" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent planner</text>

  <circle cx="220" cy="188" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="220" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Eval harness</text>

  <circle cx="620" cy="220" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="620" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Knowledge base</text>

  <circle cx="680" cy="252" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="680" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Model provider</text>

  <circle cx="820" cy="284" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="820" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Speech-to-text / TTS</text>

  <circle cx="820" cy="316" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="836" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Transcript store</text>

  <!-- Legend -->
  <line x1="40" y1="396" x2="960" y2="396" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

  <circle cx="48" cy="428" r="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="64" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Component</text>

  <line x1="220" y1="428" x2="248" y2="428" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="256" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency</text>

  <circle cx="404" cy="428" r="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
  <line x1="416" y1="428" x2="440" y2="428" stroke="#eb6c36" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="448" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Evolving</text>

  <text x="560" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">One coral. The agent planner is the one component worth watching move toward a vendor product.</text>
</svg>
