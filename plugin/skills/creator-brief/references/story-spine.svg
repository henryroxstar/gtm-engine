    .bg    { fill: #1B1815; }
    .panel { fill: #241F1B; stroke: #3A342E; }
    .ink   { fill: #EFEAE3; }
    .mute  { fill: #9A9086; }
    .acc   { fill: #D2764A; }
    .accs  { stroke: #D2764A; }
    .rule  { stroke: #3A342E; }
    .spine { stroke: #EFEAE3; }
    .tick  { fill: #241F1B; stroke: #EFEAE3; }
    .no    { fill: #E08D77; }
    .nobox { fill: #2E211D; stroke: #5B3830; }
    .yes   { fill: #9CC09E; }
    .yesbox{ fill: #1F2620; stroke: #3B4F3D; }
    .chip  { fill: #2A2521; stroke: #3A342E; }
  }
</style>

<rect class="bg" x="0" y="0" width="1240" height="940"/>

<!-- ================= 1. THE PAIR ================= -->
<text class="ink h1" x="40" y="46">The story spine</text>
<text class="mute ui sm" x="40" y="68">What the film argues, in what order, and what the last beat has to contain.</text>

<rect class="panel" x="40" y="88" width="440" height="82" rx="6"/>
<text class="acc ui lbl" x="60" y="112">HUMAN CORE VALUE</text>
<text class="ink big" x="60" y="140">an experience, not a tool</text>
<text class="mute ui xs" x="60" y="158">a camera can film <tspan font-style="italic">being believed</tspan>; it cannot film <tspan font-style="italic">voice</tspan></text>

<rect class="panel" x="760" y="88" width="440" height="82" rx="6"/>
<text class="acc ui lbl" x="780" y="112">THE OPPOSITE</text>
<text class="ink big" x="780" y="140">the counterfeit, not the absence</text>
<text class="mute ui xs" x="780" y="158">a state you reach <tspan font-style="italic">while doing everything right</tspan></text>

<line class="accs" x1="496" y1="129" x2="744" y2="129" stroke-width="1.5"/>
<path class="accs" d="M496 129 l10 -5 v10 z" fill="#A8512F" stroke="none"/>
<path class="accs" d="M744 129 l-10 -5 v10 z" fill="#A8512F" stroke="none"/>
<text class="mute ui xs" x="620" y="122" text-anchor="middle">the film is the distance</text>
<text class="mute ui xs" x="620" y="152" text-anchor="middle">between these two</text>

<rect class="nobox" x="40" y="186" width="1160" height="52" rx="6"/>
<text class="no ui lbl" x="60" y="208">THE ANTAGONIST IS NOT THE TOOL</text>
<text class="ink sm" x="60" y="228">It is <tspan font-weight="700">disappearance</tspan> — and it has two faces, not one. Sound like everyone (slop) or say nothing (silence): both end with nobody knowing you. A film whose villain is the product argues against itself.</text>

<!-- ================= 2. THE SPINE ================= -->
<text class="acc ui lbl" x="40" y="284">THE ORDER — NINE BEATS, FOUR MOVEMENTS</text>

<rect class="chip" x="70"    y="298" width="366.7" height="26" rx="4"/>
<rect class="chip" x="436.7" y="298" width="244.4" height="26" rx="4"/>
<rect class="chip" x="681.1" y="298" width="244.4" height="26" rx="4"/>
<rect class="chip" x="925.6" y="298" width="244.4" height="26" rx="4"/>
<text class="ink ui xs" x="253"  y="316" text-anchor="middle" font-weight="600">I · who, and what happens</text>
<text class="ink ui xs" x="559"  y="316" text-anchor="middle" font-weight="600">II · the wrong turn</text>
<text class="ink ui xs" x="803"  y="316" text-anchor="middle" font-weight="600">III · what it costs</text>
<text class="ink ui xs" x="1048" y="316" text-anchor="middle" font-weight="600">IV · the right turn</text>

<line class="spine" x1="70" y1="352" x2="1170" y2="352" stroke-width="1.5"/>
<g>
  <circle class="tick" cx="131.1" cy="352" r="11" stroke-width="1.5"/><text class="ink ui num" x="131.1" y="356" text-anchor="middle">1</text>
  <circle class="tick" cx="253.3" cy="352" r="11" stroke-width="1.5"/><text class="ink ui num" x="253.3" y="356" text-anchor="middle">2</text>
  <circle class="tick" cx="375.6" cy="352" r="11" stroke-width="1.5"/><text class="ink ui num" x="375.6" y="356" text-anchor="middle">3</text>
  <circle class="tick" cx="497.8" cy="352" r="11" stroke-width="1.5"/><text class="ink ui num" x="497.8" y="356" text-anchor="middle">4</text>
  <circle class="tick" cx="620.0" cy="352" r="11" stroke-width="1.5"/><text class="ink ui num" x="620.0" y="356" text-anchor="middle">5</text>
  <circle class="tick" cx="742.2" cy="352" r="11" stroke-width="1.5"/><text class="ink ui num" x="742.2" y="356" text-anchor="middle">6</text>
  <circle class="tick" cx="864.4" cy="352" r="11" stroke-width="1.5" stroke="#A8512F"/><text class="acc ui num" x="864.4" y="356" text-anchor="middle">7</text>
  <circle class="tick" cx="986.7" cy="352" r="11" stroke-width="1.5"/><text class="ink ui num" x="986.7" y="356" text-anchor="middle">8</text>
  <circle class="tick" cx="1108.9" cy="352" r="11" stroke-width="1.5" stroke="#A8512F"/><text class="acc ui num" x="1108.9" y="356" text-anchor="middle">9</text>
</g>
<g class="mute ui xs">
  <text x="131.1" y="382" text-anchor="middle">main</text><text x="131.1" y="394" text-anchor="middle">character</text>
  <text x="253.3" y="382" text-anchor="middle">inciting</text><text x="253.3" y="394" text-anchor="middle">incident</text>
  <text x="375.6" y="382" text-anchor="middle">the</text><text x="375.6" y="394" text-anchor="middle">goal</text>
  <text x="497.8" y="382" text-anchor="middle">the</text><text x="497.8" y="394" text-anchor="middle">debate</text>
  <text x="620.0" y="382" text-anchor="middle">decision 1</text><text x="620.0" y="394" text-anchor="middle">(wrong)</text>
  <text x="742.2" y="382" text-anchor="middle">escalation</text><text x="742.2" y="394" text-anchor="middle">× three</text>
  <text x="864.4" y="382" text-anchor="middle" fill="#A8512F" font-weight="700">the low</text><text x="864.4" y="394" text-anchor="middle" fill="#A8512F" font-weight="700">point</text>
  <text x="986.7" y="382" text-anchor="middle">decision 2</text><text x="986.7" y="394" text-anchor="middle">(right)</text>
  <text x="1108.9" y="382" text-anchor="middle" fill="#A8512F" font-weight="700">goal achieved,</text><text x="1108.9" y="394" text-anchor="middle" fill="#A8512F" font-weight="700">message revealed</text>
</g>
<text class="mute ui xs" x="864.4" y="336" text-anchor="middle" font-style="italic">low point</text>
<text class="mute ui xs" x="1108.9" y="336" text-anchor="middle" font-style="italic">peak</text>


<text class="mute ui xs" x="742.2" y="412" text-anchor="middle" font-style="italic">one beat, three distinct pressures</text>

<!-- ================= 3. THE CONFLICT LADDER ================= -->
<rect class="panel" x="40" y="426" width="565" height="250" rx="6"/>
<text class="acc ui lbl" x="60" y="452">THE ESCALATION — PROXIMITY, NOT VOLUME</text>
<text class="mute ui xs" x="60" y="470">Three distinct pressures. Each one gets its own body part, so the cut escalates visually too.</text>

<rect class="chip" x="60"  y="484" width="525" height="56" rx="5"/>
<text class="ink ui sm" x="76" y="504" font-weight="600">EXTERNAL · the room</text>
<text class="mute ui xs" x="76" y="521">Beat 4. The work exists; nobody is around it. Negative space, one pushed-back chair.</text>
<text class="mute ui xs" x="76" y="534">Deniable — he can still tell himself it does not matter. <tspan font-style="italic">Direct: quiet unfairness.</tspan></text>

<rect class="chip" x="84"  y="548" width="501" height="56" rx="5"/>
<text class="ink ui sm" x="100" y="568" font-weight="600">INTERPERSONAL · the face</text>
<text class="mute ui xs" x="100" y="585">Beat 5. His idea, in someone else's mouth, in a room that is listening to them.</text>
<text class="mute ui xs" x="100" y="598">Now the loss has a name. <tspan font-style="italic">Direct: recognition, never envy — envy makes him small.</tspan></text>

<rect class="chip" x="108" y="612" width="477" height="56" rx="5"/>
<text class="ink ui sm" x="124" y="632" font-weight="600">INTERNAL · the hands</text>
<text class="mute ui xs" x="124" y="649">Beat 6. He types and deletes — the same gesture as beat 3, now unprompted.</text>
<text class="mute ui xs" x="124" y="662">The first two happened to him; this one he does to himself. <tspan font-style="italic">Direct: self-betrayal.</tspan></text>

<path class="accs" d="M596 500 L596 656" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M596 662 l-5 -10 h10 z" class="acc"/>
<text class="mute ui xs" x="600" y="578" transform="rotate(90 600 578)" text-anchor="middle">closer in</text>

<!-- ================= 4. WANT / NEED, CORRECTED ================= -->
<rect class="panel" x="635" y="426" width="565" height="250" rx="6"/>
<text class="acc ui lbl" x="655" y="452">WANT AND NEED — WHAT THE LOW POINT ACTUALLY IS</text>

<rect class="nobox" x="655" y="466" width="525" height="40" rx="5"/>
<text class="no ui xs" x="671" y="483" font-weight="700">NOT AN EGO DEATH.</text>
<text class="ink ui xs" x="671" y="497">You cannot film a self-concept dying in two seconds, and at this stakes level trying is melodrama.</text>

<text class="ink ui sm" x="655" y="530" font-weight="600">WANT · the cost he counted</text>
<text class="mute ui xs" x="655" y="548">If I post and it sounds like a machine, that costs me</text>
<text class="mute ui xs" x="655" y="561">standing. So: say nothing until I can say it well.</text>
<text class="mute ui xs" x="655" y="578" font-style="italic">A sound strategy. That is what makes it tragic.</text>

<line class="rule" x1="925" y1="518" x2="925" y2="600" stroke-width="1"/>

<text class="ink ui sm" x="945" y="530" font-weight="600">NEED · the cost he did not</text>
<text class="mute ui xs" x="945" y="548">Silence is not neutral. Absence reads as absence.</text>
<text class="mute ui xs" x="945" y="561">People do not think he is careful. They think he is gone.</text>
<text class="mute ui xs" x="945" y="578" font-style="italic">He is not wrong about himself. He is wrong about a price.</text>

<rect class="yesbox" x="655" y="608" width="525" height="52" rx="5"/>
<text class="yes ui xs" x="671" y="626" font-weight="700">THE LOW POINT IS AN INVOICE, AND HE NEVER SEES IT.</text>
<text class="ink ui xs" x="671" y="642">Someone looks for them and finds nothing; only the audience sees it. Dramatic irony is</text>
<text class="ink ui xs" x="671" y="655">the strongest device a very short film owns — and decision 2 is then only an update.</text>

<!-- ================= 5. THE PAYOFF ENGINE ================= -->
<rect class="panel" x="40" y="696" width="1160" height="212" rx="6"/>
<text class="acc ui lbl" x="60" y="722">THE PAYOFF ENGINE — FIVE INGREDIENTS, EACH PINNED TO A BEAT</text>
<text class="mute ui xs" x="60" y="740">Kama muta is the sudden intensification of communal sharing. Two of the five are visible in a single frame, so a shot list can fail them.</text>

<g>
  <rect class="chip" x="60"  y="754" width="212" height="86" rx="5"/>
  <text class="acc ui num" x="76" y="774">1 · EMPATHY FIRST</text>
  <text class="ink ui xs" x="76" y="793">early beats</text>
  <text class="mute ui xs" x="76" y="810">Someone to feel <tspan font-style="italic">for</tspan> before the</text>
  <text class="mute ui xs" x="76" y="823">payoff arrives, or it is a plot event.</text>

  <rect class="chip" x="284" y="754" width="212" height="86" rx="5"/>
  <text class="acc ui num" x="300" y="774">2 · SUDDENNESS</text>
  <text class="ink ui xs" x="300" y="793">the beat before the peak</text>
  <text class="mute ui xs" x="300" y="810">One cut, not three. Promised for</text>
  <text class="mute ui xs" x="300" y="823">thirty seconds still lands sudden.</text>

  <rect class="chip" x="508" y="754" width="212" height="86" rx="5"/>
  <text class="acc ui num" x="524" y="774">3 · COMING TOGETHER</text>
  <text class="ink ui xs" x="524" y="793">the peak</text>
  <text class="mute ui xs" x="524" y="810">At the <tspan font-weight="700">threshold</tspan>, on arrival —</text>
  <text class="mute ui xs" x="524" y="823">where contact is licensed.</text>

  <rect class="chip" x="732" y="754" width="212" height="86" rx="5"/>
  <text class="acc ui num" x="748" y="774">4 · A FACE MOVED</text>
  <text class="ink ui xs" x="748" y="793">the peak, on a face</text>
  <text class="mute ui xs" x="748" y="810">Eyes closing a half-second long,</text>
  <text class="mute ui xs" x="748" y="823">the swallow, the held breath.</text>

  <rect class="chip" x="956" y="754" width="212" height="86" rx="5"/>
  <text class="acc ui num" x="972" y="774">5 · REUNION</text>
  <text class="ink ui xs" x="972" y="793">the beat after</text>
  <text class="mute ui xs" x="972" y="810">Without it there is a moment.</text>
  <text class="mute ui xs" x="972" y="823">With it there is a resolution.</text>
</g>

<rect class="nobox" x="60" y="852" width="556" height="40" rx="5"/>
<text class="no ui xs" x="76" y="869" font-weight="700">NOT A HANDSHAKE AT THE TABLE.</text>
<text class="ink ui xs" x="76" y="883">Seated people mid-conversation do not shake hands. Stock gesture; reads as the slop the film is against.</text>

<rect class="nobox" x="628" y="852" width="540" height="40" rx="5"/>
<text class="no ui xs" x="644" y="869" font-weight="700">NOT TEARS.</text>
<text class="ink ui xs" x="644" y="883">Moved is warmth, wet eyes, a swallow, a look away. Suppression plays stronger than crying — and is true.</text>
</svg>
