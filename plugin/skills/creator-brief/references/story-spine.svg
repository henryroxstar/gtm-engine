  text { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .ui   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .h1   { font-size: 27px; font-weight: 600; letter-spacing: -0.2px; }
  .lbl  { font-size: 11px; letter-spacing: 1.6px; font-weight: 600; }
  .big  { font-size: 21px; font-weight: 600; }
