<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" width="1240" height="940" role="img" aria-label="The story spine: value and its opposite, the nine-beat order, the conflict ladder, and the payoff engine">
<title>The story spine</title>
<style>
  :root { color-scheme: light dark; }
  .bg    { fill: #F4F2EE; }
  .panel { fill: #FFFFFF; stroke: #DED7CC; stroke-width: 1; }
